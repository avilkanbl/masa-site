<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>ISDAMBUL</title>
<meta name="description" content="ISDAMBUL uygulaması: mekâna birlikte gideceğin onaylı arkadaşları bul.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1328">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ISDAMBUL">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1328;--bg2:#121d3a;--card:#16223f;--line:#24335a;--gold:#c9a24b;--gold2:#e7c873;--ink:#eef1fa;--mute:#98a3c2;--ok:#3ccf7e;--bad:#ff6b6b;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold2)}
.h{font-family:"Playfair Display",Georgia,serif}
[hidden]{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
/* ---------- Intro ---------- */
#intro{z-index:50;background:#05070f;overflow:hidden;align-items:center;justify-content:center}
#intro .glow{position:absolute;inset:-30%;background:radial-gradient(40% 35% at 30% 30%,rgba(201,162,75,.22),transparent 70%),radial-gradient(45% 40% at 75% 70%,rgba(120,80,220,.25),transparent 70%),radial-gradient(35% 30% at 60% 25%,rgba(40,120,220,.18),transparent 70%);animation:drift 14s ease-in-out infinite alternate;filter:blur(10px)}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-6%,4%) rotate(12deg)}}
#intro .ph{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
#intro .ph.on{opacity:1}
#intro .ph img{width:100%;height:100%;object-fit:cover;animation:kb 7s ease-out forwards}
#intro .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,15,.55),rgba(5,7,15,.25) 40%,rgba(5,7,15,.85))}
@keyframes kb{from{transform:scale(1.18)}to{transform:scale(1)}}
#stage{position:relative;width:min(92vw,560px);height:46vh;display:flex;align-items:center;justify-content:center}
#stage svg{width:100%;height:100%;overflow:visible}
#stage text{font-family:"Dancing Script",cursive;font-weight:700;fill:transparent;stroke:#fff;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
#stage text.cap{font-family:"Playfair Display",Georgia,serif;letter-spacing:.18em;font-weight:700}
#stage text.draw{animation:draw var(--d,2.2s) cubic-bezier(.6,.05,.3,1) forwards,fillin .8s ease forwards calc(var(--d,2.2s) - .5s)}
#stage text.gold{stroke:var(--gold2)}
#stage text.gold.draw{animation:draw var(--d,2.2s) cubic-bezier(.6,.05,.3,1) forwards,fillgold .8s ease forwards calc(var(--d,2.2s) - .5s)}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes fillin{to{fill:#fff;stroke-width:.2}}
@keyframes fillgold{to{fill:url(#gg);stroke-width:.2}}
#stage .out{animation:fadeout .7s ease forwards}
@keyframes fadeout{to{opacity:0;transform:translateY(-8px);filter:blur(4px)}}
#isub{position:absolute;bottom:calc(120px + var(--sab));left:0;right:0;text-align:center;color:#cfd6ea;font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;opacity:0;transition:opacity .8s}
#isub.on{opacity:.9}
#skip{position:absolute;top:calc(14px + var(--sat));right:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#dfe5f5;padding:6px 14px;border-radius:99px;font-size:.85rem;backdrop-filter:blur(8px);z-index:3}
#istart{position:absolute;bottom:calc(40px + var(--sab));left:24px;right:24px;opacity:0;transform:translateY(16px);transition:all .7s ease;z-index:3;pointer-events:none}
#istart.on{opacity:1;transform:none;pointer-events:auto}
#istart small{display:block;text-align:center;color:#aeb7d3;margin-top:10px;font-size:.78rem}
.dots{position:absolute;bottom:calc(100px + var(--sab));display:flex;gap:6px;z-index:3}
.dots i{width:6px;height:6px;border-radius:9px;background:rgba(255,255,255,.3);transition:all .4s}
.dots i.on{width:22px;background:var(--gold2)}
/* ---------- Buttons ---------- */
.bg{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-weight:700;font-size:1.02rem;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;box-shadow:0 10px 30px -10px rgba(201,162,75,.7)}
.bg:active{transform:scale(.98)}
.bo{display:block;width:100%;border:1px solid var(--line);border-radius:16px;padding:14px 18px;font-weight:600;background:rgba(255,255,255,.04)}
.bs{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:8px 14px;font-weight:600;font-size:.9rem}
.bs.g{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.bs.r{color:#ffb4b4;border-color:#5a2a35}
button:disabled{opacity:.5}
/* ---------- Auth ---------- */
#auth{z-index:40;overflow:auto}
#auth .top{position:relative;height:38vh;min-height:230px;overflow:hidden}
#auth .top img{width:100%;height:100%;object-fit:cover}
#auth .top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,19,40,.2),var(--bg))}
#auth .brand{position:absolute;left:24px;bottom:18px;z-index:2}
#auth .brand b{font:700 2rem "Playfair Display",Georgia,serif;letter-spacing:.12em}
#auth .brand span{display:block;font-family:"Dancing Script",cursive;font-size:1.6rem;color:var(--gold2);margin-top:-4px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;margin:0 20px 16px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;color:var(--mute);font-weight:600}
.seg button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.form{padding:0 20px calc(30px + var(--sab))}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:.8rem;color:var(--mute);margin:0 0 5px 4px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:0;font-size:16px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:#c6cde2;margin:8px 0}
.chk input{width:20px;height:20px;accent-color:var(--gold);flex:none;margin-top:1px}
.msg{display:none;margin:12px 0 0;padding:11px 14px;border-radius:12px;font-size:.9rem}
.msg.ok{display:block;background:rgba(60,207,126,.12);color:#9ff0c4}
.msg.err{display:block;background:rgba(255,107,107,.12);color:#ffb4b4}
.lnk{background:none;border:0;color:var(--gold2);padding:0;font-size:.9rem}
.guest{text-align:center;margin-top:16px}
/* ---------- Main ---------- */
#main{z-index:10}
.hdr{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 18px 10px;background:linear-gradient(180deg,var(--bg) 70%,rgba(11,19,40,0));position:relative;z-index:5}
.hdr h1{flex:1;margin:0;font:700 1.5rem "Playfair Display",Georgia,serif}
.hdr h1 small{display:block;font:600 .75rem/1 -apple-system,sans-serif;letter-spacing:.18em;color:var(--gold2);text-transform:uppercase;margin-bottom:4px}
.pill{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.9rem}
.pill i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold2),var(--gold) 60%,#8a6a1f)}
.ib{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center}
.ib svg{width:20px;height:20px}
.ib .bd{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(96px + var(--sab))}
.view[hidden]{display:none}
.sec{padding:6px 18px 4px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{margin:14px 0 8px;font:700 1.15rem "Playfair Display",Georgia,serif}
.sec a,.sec button{font-size:.85rem;color:var(--gold2);background:none;border:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar,.car::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:7px 14px;font-size:.88rem;color:#cbd2e8;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:700}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 18px 14px;scrollbar-width:none}
.rc{flex:none;width:78vw;max-width:340px;scroll-snap-align:center;border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);position:relative;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);text-align:left;padding:0}
.rc .im{height:210px;position:relative;overflow:hidden}
.im{background:linear-gradient(135deg,hsl(var(--h,250) 55% 20%),hsl(calc(var(--h,250) + 40) 60% 34%))}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(11,19,40,.95))}
.rc .ov{position:absolute;left:16px;right:16px;bottom:12px;z-index:2}
.rc .ov b{display:block;font:700 1.15rem "Playfair Display",Georgia,serif;line-height:1.25}
.rc .ov span{font-size:.85rem;color:#cfd6ea}
.tag{position:absolute;top:12px;left:12px;z-index:2;background:rgba(11,19,40,.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:4px 10px;font-size:.75rem;font-weight:600}
.tag.r{left:auto;right:12px;color:var(--gold2)}
.rc .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 16px}
.rc .ft small{color:var(--mute);font-size:.82rem}
.vb{color:var(--ok);font-size:.78rem;font-weight:600}
.empty{color:var(--mute);text-align:center;padding:28px 24px;font-size:.95rem}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 18px 8px}
.cat{border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;background:linear-gradient(160deg,hsl(var(--h) 50% 18%),var(--bg2));font-size:.85rem;font-weight:600}
.cat[aria-pressed=true]{outline:2px solid var(--gold)}.cat svg{width:26px;height:26px;display:block;margin:0 auto 6px;stroke:var(--gold2);fill:none;stroke-width:1.6}
.vl{padding:0 18px}
.vi{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.vi .im{width:64px;height:64px;border-radius:14px;flex:none;position:relative;overflow:hidden}
.vi .im::after{display:none}
.vi b{display:block;font-size:.98rem}
.vi span{font-size:.82rem;color:var(--mute)}
.search{margin:6px 18px 6px;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{flex:1;background:none;border:0;outline:0;padding:12px 0;font-size:16px}
.search svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2}
/* tab bar */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sab));z-index:20;display:flex;align-items:center;justify-content:space-around;background:rgba(18,29,58,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);border-radius:26px;padding:8px 6px;box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;position:relative}
.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-selected=true]{color:var(--gold2)}
.tabs .plus{flex:none;width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;margin:-26px 6px 0;box-shadow:0 10px 24px -6px rgba(201,162,75,.8);justify-content:center}
.tabs .plus svg{width:26px;height:26px;stroke-width:2.4}
.tabs .bd{position:absolute;top:0;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:.62rem;font-weight:700;display:grid;place-items:center;padding:0 3px}
/* list rows */
.row{margin:0 18px 12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.row h4{margin:0 0 4px;font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .m{font-size:.84rem;color:var(--mute)}
.row .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.st{font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 9px;background:rgba(255,255,255,.08);color:#cfd6ea}
.st.ok{background:rgba(60,207,126,.15);color:#8ff0bb}.st.wait{background:rgba(231,200,115,.15);color:var(--gold2)}.st.no{background:rgba(255,107,107,.15);color:#ffb4b4}
.rq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0 0;margin-top:10px;border-top:1px solid rgba(255,255,255,.06);font-size:.9rem}
.rq .bt{display:flex;gap:6px}
.chl{display:flex;gap:12px;align-items:center;width:calc(100% - 36px);margin:0 18px 10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left}
.av{width:48px;height:48px;border-radius:16px;flex:none;display:grid;place-items:center;font:700 1.1rem "Playfair Display",Georgia,serif;background:linear-gradient(135deg,#2a3a68,#1a2548);color:var(--gold2);position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.chl .t{flex:1;min-width:0}
.chl b{display:block}
.chl .lm{display:block;font-size:.84rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chl time{font-size:.72rem;color:var(--mute);align-self:flex-start}
.chl.un b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold2);margin-left:6px;vertical-align:middle}
/* profile */
.ph{display:flex;flex-direction:column;align-items:center;padding:10px 18px 6px;text-align:center}
.ph .av{width:92px;height:92px;border-radius:30px;font-size:2rem;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--gold)}
.ph h3{margin:12px 0 2px;font:700 1.4rem "Playfair Display",Georgia,serif}
.wal{margin:12px 18px;border-radius:22px;padding:18px;background:linear-gradient(135deg,#2b2412,#141a30 60%);border:1px solid #4b3e1c;display:flex;align-items:center;justify-content:space-between}
.wal b{font:700 2rem "Playfair Display",Georgia,serif;color:var(--gold2)}
.wal small{display:block;color:#cbbf9c;font-size:.8rem}
.menu{margin:8px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.menu button,.menu a{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.05);text-align:left;color:var(--ink);text-decoration:none;font-size:.95rem}
.menu button:last-child,.menu a:last-child{border-bottom:0}
.menu svg{width:20px;height:20px;stroke:var(--gold2);fill:none;stroke-width:1.8;flex:none}
.menu .r{margin-left:auto;color:var(--mute)}
/* sheet */
.sh{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.sh.on{opacity:1;pointer-events:auto}
.sh .pn{width:100%;max-height:92vh;overflow:auto;background:var(--bg2);border-radius:26px 26px 0 0;border-top:1px solid var(--line);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:0 0 calc(20px + var(--sab))}
.sh.on .pn{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:10px auto 6px}
.pn .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 8px}
.pn .hd h3{margin:0;font:700 1.25rem "Playfair Display",Georgia,serif}
.x{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.08);font-size:1.2rem;line-height:1}
.pb{padding:0 20px}
.hero2{height:240px;position:relative;margin:-6px 0 0;overflow:hidden}
.hero2 .ov{position:absolute;left:20px;right:20px;bottom:14px;z-index:2}
.hero2 .ov b{font:700 1.5rem "Playfair Display",Georgia,serif;display:block}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kv small{display:block;color:var(--mute);font-size:.75rem}
.kv b{font-size:.95rem}
.note{background:rgba(201,162,75,.08);border:1px solid rgba(201,162,75,.25);border-radius:14px;padding:12px 14px;font-style:italic;color:#e9dfc4;margin:0 0 14px}
/* chat */
#chat{z-index:45;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#chat.on{transform:none}
#chat .hdr{border-bottom:1px solid var(--line);background:var(--bg)}
#chat .hdr h1{font-size:1.05rem}
#chat .hdr h1 small{letter-spacing:0;text-transform:none;color:var(--mute);font-size:.75rem}
#clog{flex:1;overflow:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:6px}
.cm{max-width:80%;align-self:flex-start}
.cm .who{font-size:.72rem;color:var(--gold2);margin:0 0 2px 10px}
.cm .bb{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 13px;word-wrap:break-word}
.cm time{display:block;font-size:.66rem;color:var(--mute);margin:2px 10px 0}
.cm.me{align-self:flex-end}
.cm.me .bb{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;border:0;border-radius:18px 18px 6px 18px}
.cm.me time{text-align:right}
.sys{align-self:center;font-size:.78rem;color:var(--mute);background:rgba(255,255,255,.05);border-radius:99px;padding:4px 12px}
#cform{display:flex;gap:8px;padding:10px 12px calc(10px + var(--sab));border-top:1px solid var(--line);background:var(--bg)}
#cform input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:12px 16px;outline:0;font-size:16px}
#cform button{width:46px;height:46px;border-radius:50%;border:0;background:var(--gold);display:grid;place-items:center}
#cform svg{width:20px;height:20px;stroke:#1a1405;fill:none;stroke-width:2.2}
.mem{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.mem span{flex:none;font-size:.78rem;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.mem button{background:none;border:0;color:var(--mute);padding:0 0 0 4px;font-size:.8rem}
/* toasts */
#toast{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translate(-50%,-140%);z-index:90;background:rgba(22,34,63,.96);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:.9rem;max-width:90vw;transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{transform:translate(-50%,0)}#toast:not(.on){opacity:0;transition:transform .35s,opacity .2s .2s}
#toast.err{border-color:#5a2a35;color:#ffc4c4}
/* packages */
.pk{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;text-align:left}
.pk .coin{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,var(--gold2),var(--gold) 60%,#8a6a1f);display:grid;place-items:center;color:#2a1f05;font-weight:800;font-size:.85rem}
.pk b{display:block;font-size:1.05rem}
.pk small{color:var(--mute)}
.pk .pr{margin-left:auto;text-align:right}
.pk .pr s{display:block;color:var(--mute);font-size:.8rem}
.pk .pr b{color:var(--gold2);white-space:nowrap}.pk .pr s{white-space:nowrap}.fld input[type=file]{padding:10px;color:var(--mute);font-size:.85rem}
.pk.best{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pm{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;text-align:left}
.pm.on{border-color:var(--gold);background:rgba(201,162,75,.08)}
.pm svg{width:24px;height:24px;stroke:var(--gold2);fill:none;stroke-width:1.7;flex:none}
.pm .bdg{margin-left:auto;background:var(--gold);color:#1a1405;font-size:.72rem;font-weight:800;border-radius:99px;padding:3px 9px}
.bank{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin:10px 0}
.bank div{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.9rem}
.bank div:last-child{border-bottom:0}
.bank span{color:var(--mute);width:72px;flex:none}
.bank b{flex:1;word-break:break-all}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--gold2);animation:sp 1s linear infinite;margin:14px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.done{text-align:center;padding:16px 0}
.done .ic{width:74px;height:74px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:2rem;background:rgba(60,207,126,.15);color:var(--ok)}
.skel{background:linear-gradient(90deg,var(--card),#1c2a4d,var(--card));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:22px}
@keyframes sk{to{background-position:-200% 0}}
.fadein{animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.splash{position:fixed;inset:0;z-index:70;background:#05070f;display:grid;place-items:center;transition:opacity .5s}
.splash svg{width:84px;height:84px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06);opacity:.8}}
</style>
</head>

function notifSheet(){const L=NT.items;
 sheet(`<div class="hd"><h3>Bildirimler</h3><button class="x" data-close>×</button></div><div class="pb">${L.length?`<p style="text-align:right;margin:0 0 6px"><button class="lnk" id="nall">Tümünü okundu say</button></p>`+L.map(n=>`<button class="chl${n.read?"":" un"}" style="width:100%;margin:0 0 8px" data-nid="${n.id}"><div class="t"><b>${esc(n.title)}</b><span class="lm" style="white-space:normal">${esc(n.body||"")}</span></div><time>${ago(n.created_at)}</time></button>`).join(""):'<p class="empty">Henüz bildirimin yok. Oda istekleri, onaylar ve mesajlar burada görünür.</p>'}</div>`);
 const a=$("#nall");if(a)a.onclick=async()=>{await sb.rpc("mark_notifications_read",{p_ids:null});await loadNotifs();notifSheet()};
 $$("#pn [data-nid]").forEach(b=>b.onclick=()=>{const n=NT.items.find(x=>String(x.id)===b.dataset.nid);if(!n)return;if(!n.read)sb.rpc("mark_notifications_read",{p_ids:[n.id]}).then(()=>loadNotifs());closeSheet();
  const k=n.kind;if((k==="message"||k==="approved"||k==="joined")&&n.room_id)return openChat(n.room_id);if(k==="request"||k==="left"){RSEG="own";return tab("rooms")}if(k==="rejected"||k==="removed"||k==="cancelled"){RSEG="req";return tab("rooms")}tab("me")})}
$("#bell").onclick=()=>{notifSheet();loadNotifs()};

/* ================= BOOT ================= */
async function afterIntro(){U=await user();if(U)return enterMain();showAuth(true)}
(async function boot(){
 if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
 if(!sb){$("#splash").innerHTML='<p style="color:#fff;padding:30px;text-align:center">Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.</p>';return}
 const seen=LS.get("intro1")==="1";
 setTimeout(()=>{$("#splash").style.opacity=0;setTimeout(()=>$("#splash").remove(),500)},seen?700:300);
 if(!seen){try{await document.fonts.load('700 40px "Dancing Script"');}catch(e){}intro();return}
 afterIntro()})();
sb&&sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){U=null;P=null}});
</script>
